{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete | NTTS CMS</title><style>body{font:15px Arial;background:#f4f7f5;color:#18221c;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:35px;border-radius:18px;max-width:520px;width:90%;box-shadow:0 10px 35px #102b1714}button{background:#b42318;color:white;border:0;padding:12px 20px;border-radius:9px;cursor:pointer}a{color:#10844f;margin-left:15px}</style><link rel="stylesheet" href="{% static 'css/cms-premium.css' %}"><style id="ntts-global-theme">:root{--ntts-primary:{% if site_theme %}{{ site_theme.primary_color }}{% else %}#10844F{% endif %};--ntts-dark:{% if site_theme %}{{ site_theme.dark_color }}{% else %}#181C24{% endif %};--ntts-bg:{% if site_theme %}{{ site_theme.background_color }}{% else %}#FBFBF9{% endif %};--ntts-heading:{% if site_theme %}{{ site_theme.heading_text_color }}{% else %}#181C24{% endif %};--ntts-body:{% if site_theme %}{{ site_theme.body_text_color }}{% else %}#475569{% endif %};--ntts-button-text:{% if site_theme %}{{ site_theme.button_text_color }}{% else %}#FFFFFF{% endif %};--ntts-radius:{% if site_theme %}{{ site_theme.border_radius }}{% else %}16{% endif %}px}body{font-family:{% if site_theme %}"{{ site_theme.font_body }}"{% else %}Poppins{% endif %},sans-serif}h1,h2,h3,h4,h5,h6{font-family:{% if site_theme %}"{{ site_theme.font_heading }}"{% else %}"Space Grotesk"{% endif %},sans-serif} .ntts-theme-preview-text{color:var(--ntts-body)} .ntts-theme-button{background:var(--ntts-primary);color:var(--ntts-button-text)} </style>
</head><body><main class="card"><h2>Delete {{ title }} item?</h2><p>Are you sure you want to permanently delete <b>{{ object }}</b>?</p><form method="post">{% csrf_token %}<button type="submit">Yes, delete</button><a href="/cms/{{ model_key }}/">Cancel</a></form></main></body></html>
