{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title|default:"Customer Login" }} | NTTS Mobility</title><link rel="stylesheet" href="{% static 'css/site.css' %}"><style>
.auth-wrap{min-height:80vh;display:grid;place-items:center;padding:48px 18px;background:#f5f8f6}.auth-card{width:min(100%,480px);background:#fff;padding:38px;border:1px solid #e1e9e4;border-radius:22px;box-shadow:0 18px 50px #17291e12}.auth-card h1{font:700 32px/1.2 'Space Grotesk',Arial,sans-serif;margin:0 0 10px;color:#17251e}.auth-card p{font-size:16px;line-height:1.7;color:#56645c}.auth-card label{display:block;font-weight:600;font-size:15px;margin:20px 0 8px}.auth-card input{width:100%;padding:15px;border:1px solid #cbd8d0;border-radius:11px;font-size:17px}.auth-card button,.auth-btn{display:inline-block;margin-top:20px;background:#10844f;color:white;border:0;border-radius:11px;padding:15px 22px;font-weight:700;font-size:16px;cursor:pointer}.auth-error{color:#a12424;font-size:14px;margin-top:12px}.dash-wrap{max-width:1160px;margin:48px auto;padding:0 20px}.dash-wrap h1{font:700 34px 'Space Grotesk',Arial,sans-serif}.ride-card{border:1px solid #dfe8e2;border-radius:16px;padding:22px;margin:16px 0;background:white}.ride-card h3{font-size:19px}.ride-meta{font-size:15px;line-height:1.9;color:#47564d}.ride-status{display:inline-block;background:#e9f8ef;color:#087346;border-radius:30px;padding:7px 12px;font-weight:700;font-size:14px}.dash-links{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.dash-links a{background:#e9f6ef;padding:11px 15px;border-radius:9px;color:#087346;font-weight:700}
</style><style id="ntts-global-theme">:root{--ntts-primary:{% if site_theme %}{{ site_theme.primary_color }}{% else %}#10844F{% endif %};--ntts-dark:{% if site_theme %}{{ site_theme.dark_color }}{% else %}#181C24{% endif %};--ntts-bg:{% if site_theme %}{{ site_theme.background_color }}{% else %}#FBFBF9{% endif %};--ntts-heading:{% if site_theme %}{{ site_theme.heading_text_color }}{% else %}#181C24{% endif %};--ntts-body:{% if site_theme %}{{ site_theme.body_text_color }}{% else %}#475569{% endif %};--ntts-button-text:{% if site_theme %}{{ site_theme.button_text_color }}{% else %}#FFFFFF{% endif %};--ntts-radius:{% if site_theme %}{{ site_theme.border_radius }}{% else %}16{% endif %}px}body{font-family:{% if site_theme %}"{{ site_theme.font_body }}"{% else %}Poppins{% endif %},sans-serif}h1,h2,h3,h4,h5,h6{font-family:{% if site_theme %}"{{ site_theme.font_heading }}"{% else %}"Space Grotesk"{% endif %},sans-serif} .ntts-theme-preview-text{color:var(--ntts-body)} .ntts-theme-button{background:var(--ntts-primary);color:var(--ntts-button-text)} </style>
</head><body><header class="site-nav"><a class="logo" href="/"><img src="{% static 'images/ntts-logo-figma.png' %}" alt="NTTS Mobility" class="brand-logo"></a><nav id="navLinks"><a href="/">Home</a><a href="/#fleet-motion">Fleet</a><a href="/#pricing">Pricing</a><a href="/my-rides/">My Rides</a><a href="/customer/profile/">Profile</a><a href="/customer/logout/">Logout</a></nav></header><main class="auth-wrap"><section class="auth-card"><h1>Verify OTP</h1><p>Enter the OTP sent to +91 {{ phone }}.</p><form method="post">{% csrf_token %}<label for="otp">One-Time Password</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required><button type="submit">Verify & Login</button></form>{% if error %}<p class="auth-error">{{ error }}</p>{% endif %}<p><a href="/customer/login/">Change mobile number</a></p></section></main></body></html>
