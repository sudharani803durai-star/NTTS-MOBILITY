{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTTS Mobility CMS Login</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#073e31,#10844f 55%,#0a6657);font-family:Poppins,sans-serif;color:#181c24;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:38px;box-shadow:0 25px 70px #001c164d}.brand{font:700 25px 'Space Grotesk';color:#10844f;letter-spacing:.4px}.brand small{display:block;font:600 10px Poppins;letter-spacing:3px;color:#26352e;margin-top:2px}.card h1{font:700 27px 'Space Grotesk';margin:30px 0 6px}.card p{color:#657169;font-size:13px;margin:0 0 25px}label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #dce6e0;border-radius:12px;font:inherit;outline:none}input:focus{border-color:#10844f;box-shadow:0 0 0 3px #10844f18}button{width:100%;border:0;border-radius:12px;background:#10844f;color:white;padding:15px;font:600 14px Poppins;margin-top:22px;cursor:pointer}.error{background:#fff0f0;color:#a32a2a;padding:11px;border-radius:10px;font-size:12px}.back{display:block;text-align:center;color:#10844f;text-decoration:none;font-size:12px;margin-top:20px}</style><link rel="stylesheet" href="{% static 'css/cms-premium.css' %}"><style id="ntts-global-theme">:root{--ntts-primary:{% if site_theme %}{{ site_theme.primary_color }}{% else %}#10844F{% endif %};--ntts-dark:{% if site_theme %}{{ site_theme.dark_color }}{% else %}#181C24{% endif %};--ntts-bg:{% if site_theme %}{{ site_theme.background_color }}{% else %}#FBFBF9{% endif %};--ntts-heading:{% if site_theme %}{{ site_theme.heading_text_color }}{% else %}#181C24{% endif %};--ntts-body:{% if site_theme %}{{ site_theme.body_text_color }}{% else %}#475569{% endif %};--ntts-button-text:{% if site_theme %}{{ site_theme.button_text_color }}{% else %}#FFFFFF{% endif %};--ntts-radius:{% if site_theme %}{{ site_theme.border_radius }}{% else %}16{% endif %}px}body{font-family:{% if site_theme %}"{{ site_theme.font_body }}"{% else %}Poppins{% endif %},sans-serif}h1,h2,h3,h4,h5,h6{font-family:{% if site_theme %}"{{ site_theme.font_heading }}"{% else %}"Space Grotesk"{% endif %},sans-serif} .ntts-theme-preview-text{color:var(--ntts-body)} .ntts-theme-button{background:var(--ntts-primary);color:var(--ntts-button-text)} </style>
</head><body><main class="card"><div class="brand">NTTS MOBILITY<small>CONTENT MANAGEMENT SYSTEM</small></div><h1>Welcome back</h1><p>Sign in to manage your website and ride operations.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">Staff username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in to CMS →</button></form><a class="back" href="/">← Back to NTTS Mobility website</a></main></body></html>
